<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Страница не найдена | АвтоУход</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --dark-bg: #0a0a0a;
            --gold: #d4af37;
            --text-light: #f5f5f5;
            --text-gray: #b0b0b0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--dark-bg);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            background: linear-gradient(135deg, rgba(10,10,10,0.95) 0%, rgba(10,10,10,0.8) 100%);
        }

        .container {
            max-width: 600px;
        }

        .error-code {
            font-size: 8rem;
            font-weight: 800;
            color: var(--gold);
            margin-bottom: 20px;
            line-height: 1;
            font-family: 'Playfair Display', serif;
        }

        .error-title {
            font-size: 2.5rem;
            margin-bottom: 20px;
            color: var(--text-light);
        }

        .error-description {
            font-size: 1.2rem;
            color: var(--text-gray);
            margin-bottom: 40px;
            line-height: 1.6;
        }

        .back-home {
            display: inline-block;
            padding: 15px 40px;
            background: linear-gradient(135deg, var(--gold) 0%, #9c7c2c 100%);
            color: var(--dark-bg);
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            margin-bottom: 30px;
        }

        .back-home:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(212, 175, 55, 0.4);
        }

        .contact-info {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 1px solid rgba(212, 175, 55, 0.2);
        }

        .contact-info p {
            color: var(--text-gray);
            margin-bottom: 10px;
        }

        .contact-info a {
            color: var(--gold);
            text-decoration: none;
        }

        @media (max-width: 768px) {
            .error-code {
                font-size: 6rem;
            }
            
            .error-title {
                font-size: 2rem;
            }
            
            .error-description {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="error-code">404</div>
        <h1 class="error-title">Страница не найдена</h1>
        <p class="error-description">
            К сожалению, запрашиваемая вами страница не существует или была перемещена.
            Возможно, вы ошиблись при вводе адреса или страница была удалена.
        </p>
        <a href="index.html" class="back-home">
            <i class="fas fa-home"></i> Вернуться на главную
        </a>
        
        <div class="contact-info">
            <p>Если проблема повторяется, свяжитесь с нами:</p>
            <p><i class="fas fa-phone"></i> +7 (495) 123-45-67</p>
            <p><i class="fas fa-envelope"></i> <a href="mailto:info@autouhod.ru">info@autouhod.ru</a></p>
        </div>
    </div>
</body>
</html>
